apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
  annotations:
    kubernetes.io/change-cause: "Upgrade image to nginx:1.26-alpine with zero-downtime strategy"
spec:
  replicas: 3
  # Strategy configures how pods are replaced during rolling update
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod above desired replicas during update
      maxUnavailable: 0  # Do NOT terminate any old pod until a new pod is Ready (Guaranteed Zero Downtime)
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        # A template annotation change also ensures a rolling update is triggered
        version: "v2.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
