apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-app.fullname" . }}-config
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Helm Demo</title></head>
    <body>
      <h1>{{ .Values.message }}</h1>
      <p>Release Name: {{ .Release.Name }}</p>
      <p>Namespace: {{ .Release.Namespace }}</p>
    </body>
    </html>
