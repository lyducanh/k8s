apiVersion: v1
kind: Pod
metadata:
  name: sidecar-nginx
  labels:
    app: sidecar-nginx
spec:
  volumes:
  - name: shared-html
    emptyDir: {}
  containers:
  # Primary Nginx container serving the HTML
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-html
      mountPath: /usr/share/nginx/html
  # Sidecar container generating the content
  - name: content-generator
    image: busybox:latest
    command: ['sh', '-c', 'while true; do echo "<h1>Hello from the sidecar!</h1><p>Time: $(date)</p>" > /var/www/html/index.html; sleep 5; done']
    volumeMounts:
    - name: shared-html
      mountPath: /var/www/html
