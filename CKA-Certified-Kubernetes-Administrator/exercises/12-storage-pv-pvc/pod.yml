apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: exercise-12
spec:
  volumes:
    - name: st
      persistentVolumeClaim:
        claimName: my-pvc
  containers:
    - name: nginx
      image: nginx:1.14.2
      ports:
        - containerPort: 80
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: st
