apiVersion: v1
kind: Pod
metadata:
  name: storage-demo-pod
  labels:
    app: storage-demo
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: my-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: my-storage
    persistentVolumeClaim:
      claimName: simple-pvc
